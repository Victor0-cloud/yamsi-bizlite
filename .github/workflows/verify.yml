# Verification-only CI: runs the offline unittest suite.
# - No .env files are loaded or created.
# - No secrets are defined or referenced.
# - No Supabase, Meta, Render, or other external service is contacted
#   (all tests mock HTTP/database operations; see test_*.py).
# - No deploy and no migration steps.
name: verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Run unittest suite
        run: python -m unittest discover -v
